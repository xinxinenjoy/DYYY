name: build deb

on:
  push:
    branches:
      - main
    paths:
      - '*.h'
      - '*.m'
      - '*.mm'
      - '*.x'
      - '*.xm'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.s'
      - '*.S'
      - 'DYYY.plist'
      - 'control'
      - 'Makefile'
      - 'Resources/**'
      - 'layout/**'
  workflow_dispatch:
    inputs:
      scheme:
        description: '打包方案（留空则全打）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rootful
          - rootless
          - roothide

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.relevance.outputs.should_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: relevance
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             .github/scripts/build-relevance.sh range "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build-relevant plugin, package, or Makefile changes detected."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only non-build Makefile settings changed; skipping Deb build."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Remove unused Homebrew taps
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Prepare Theos
        # 原 huami1314/theos-action 仓库已失效（404），改用社区维护的等价 action
        uses: Randomblock1/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Clean packages dir
        run: rm -rf packages && mkdir -p packages
        
      - name: Build Rootful
        run: |
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootful.deb"
          done
             
      - name: Build Rootless
        run: |
          #make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done
          
      - name: Build Roothide
        run: |
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-roothide.deb"
          done
          
      - name: Prepare package metadata
        id: package
        run: |
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read package version from control" >&2
            exit 1
          fi
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Deb packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb_files=(packages/*.deb)
          if [ "${#deb_files[@]}" -ne 3 ]; then
            echo "Expected 3 Deb packages, found ${#deb_files[@]}:" >&2
            printf '  %s\n' "${deb_files[@]}" >&2
            exit 1
          fi

          for scheme in rootful rootless roothide; do
            scheme_files=(packages/*-"${scheme}".deb)
            if [ "${#scheme_files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${scheme} package, found ${#scheme_files[@]}" >&2
              exit 1
            fi
          done

          printf 'Package artifact: %s\n' "${deb_files[@]}"

      - name: Extract arm64e dylib
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: .github/scripts/extract-release-dylib.sh

      # 巨魔注入器（TrollFools 等）需要裸 dylib：三种打包方案的依赖路径不同，
      # 全部产出，注入后哪个能正常加载就用哪个。
      - name: Extract dylibs for TrollFools
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          for scheme in rootful rootless roothide; do
            matches=(packages/*-"${scheme}".deb)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "skip ${scheme}: package not found"
              continue
            fi
            work_dir=$(mktemp -d)
            (
              cd "$work_dir"
              ar -x "$GITHUB_WORKSPACE/${matches[0]}"
              tar -xf data.tar.* 2>/dev/null || tar -xf data.tar 2>/dev/null
            )
            dylib_path=$(find "$work_dir" -type f -name 'DYYY.dylib' | head -n 1)
            if [ -z "$dylib_path" ]; then
              echo "skip ${scheme}: DYYY.dylib not found in package"
              rm -rf "$work_dir"
              continue
            fi
            cp "$dylib_path" "packages/DYYY_${version}-${scheme}.dylib"
            lipo -info "packages/DYYY_${version}-${scheme}.dylib" || true
            rm -rf "$work_dir"
          done
          ls -l packages/*.dylib

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-${{ steps.package.outputs.timestamp }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib
